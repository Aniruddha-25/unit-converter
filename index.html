<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>unit-converter</title>
    <script>
      // Apply the theme for the user's local time (light 06:00-17:59, dark otherwise) before the page paints, so there is no flash.
      // Keep the hours in sync with src/components/shared/ThemeToggle/theme.ts.
      (function () {
        var hour = new Date().getHours()
        document.documentElement.dataset.theme = hour >= 6 && hour < 18 ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
